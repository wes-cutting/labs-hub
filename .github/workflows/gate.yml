# ============================================================================
# CI gate — labs-hub. Wired to the stack (ADR-0001: Docker/Compose infra).
# Mirrors the local gate (`make gate`), same checks/order:
#   lint (yamllint) -> validate (docker compose config) -> shellcheck
#
# Notes:
#   - No app code yet (LH-S1 is assemble-and-configure), so there is no typecheck/
#     unit/build step to run. The SMOKE test (Homepage + Portainer reachable) runs
#     ON THE PI post-deploy, not in CI — CI has no docker socket / running services.
#   - Add SCA (e.g. trivy image scan) and app-test steps as real code/images land.
# ============================================================================
name: gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: lint (yamllint)
        run: pipx run yamllint deploy/

      - name: validate (docker compose config)
        run: docker compose -f deploy/compose.yml -f deploy/compose.media.yml config -q

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh
